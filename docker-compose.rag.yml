# ================================================================
# sheyingtong RAG 增强档（可选）——在主 compose 之上叠加向量检索服务
# ----------------------------------------------------------------
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.rag.yml up -d --build
#
# 提供：
#   · chroma  (8002)  —— Chroma 向量库（自建 FastAPI 服务，后端走自定义 /collections 路由）
#   · vector  (8001)  —— Qwen3-Embedding-0.6B 向量化服务
# 并把 backend 的 external embedding 开关打开、Chroma 指向本服务。
#
# ⚠️ 模型下载：vector 首次启动会从 HuggingFace 下载 Qwen3-Embedding-0.6B（约 1.2GB）
#    到 /models 卷，之后复用缓存无需联网。若服务器无法访问 HF，可先在本机
#    vector-service 目录完成下载后整目录拷到服务器，或改用条形内置 BGE 模型
#    （把 EMBEDDING_LOCAL_SERVICE_ENABLED 改回 "false" 并去掉 EMBEDDING_LOCAL_SERVICE_URL）。
#
# ⚠️ Chroma 首次启动会全量向量化 MySQL 中的术语/器材（500+ 条约 1~3 分钟），
#    期间 RAG 检索结果为空属正常；后端启动日志中会看到自动同步完成。
#
# ⚠️ 换向量模型（Qwen3-Embedding ↔ BGE）后维度不一致（1024 ↔ 512），
#    需 `docker compose down && docker volume rm sheyingtong-chroma-data` 清库重建。
# ================================================================

services:
  # ---------- Chroma 向量库（自建服务） ----------
  chroma:
    build: ./chroma-service
    container_name: sheyingtong-chroma
    # 后端按服务名访问，无需映射宿主端口；需要本机调试时打开下面注释
    # ports:
    #   - "8002:8002"
    volumes:
      # main.py 按 __file__ 计算持久化目录为 /chroma-data，卷必须挂这里
      - chroma-data:/chroma-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ---------- Qwen3-Embedding 向量化服务 ----------
  vector:
    build: ./vector-service
    container_name: sheyingtong-vector
    # ports:
    #   - "8001:8001"
    volumes:
      - vector-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s   # 首次启动要下载/加载 1.2GB 模型，多给点时间
    restart: unless-stopped

  # ---------- 后端：打开 RAG 接线 ----------
  backend:
    environment:
      EMBEDDING_LOCAL_SERVICE_ENABLED: "true"
      EMBEDDING_LOCAL_SERVICE_URL: http://vector:8001
      CHROMA_HOST: chroma
      CHROMA_PORT: "8002"
      APP_RAG_AUTO_SYNC: "true"
    depends_on:
      chroma:
        condition: service_healthy
      vector:
        condition: service_healthy

volumes:
  chroma-data:
    name: sheyingtong-chroma-data
  vector-models:
    name: sheyingtong-vector-models