server:
  port: 8080
  tomcat:
    max-http-form-post-size: 50MB

logging:
  level:
    com.sheyingtong.service.PhotographyTools: DEBUG
    com.sheyingtong.service.ChatService: DEBUG

spring:
  application:
    name: sheyingtong
  
  datasource:
    # ⚠️ JDBC URL 注意：characterEncoding 参数的值必须写 Java 识别的 charset 名 "UTF-8"
    #     绝对不能写 MySQL 的 charset 名 "utf8mb4"！因为 "utf8mb4" 是 MySQL 发明的名字，
    #     Java String.lookupCharset("utf8mb4") 直接抛 java.io.UnsupportedEncodingException，
    #     导致 HikariPool 初始化挂掉 → 后端完全起不来。
    #   · MySQL 服务端：库/表/列 字符集用 utf8mb4 ✅（schema.sql / data.sql 里继续用 utf8mb4）
    #   · JDBC 连接串：characterEncoding= UTF-8 ✅（Java 世界的标准名，Connector/J 内部自动转成 utf8mb4 协议）
    #   · connectionCollation：写 MySQL 排序规则 utf8mb4_unicode_ci ✅（排序规则是 MySQL 的概念）
    url: ${DB_URL:jdbc:mysql://localhost:3306/sheyingtong?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # ⚠️ SET NAMES utf8mb4 是发给 MySQL 服务器执行的 SQL，用 MySQL 自己的字符集名 ✅
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  
  jpa:
    hibernate:
      ddl-auto: update
    # ⚠️ 关键：Hibernate ddl-auto=update 建表完成后再执行 data.sql
    #   没有这行的话 data.sql 会先跑 → 表不存在 → 启动报错
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        connection:
          # ⚠️ 同 datasource.url 的 characterEncoding，必须写 Java 识别的 "UTF-8"，不能写 "utf8mb4"
          characterEncoding: UTF-8
          useUnicode: true
          # ⚠️ connectionCollation 是 MySQL 排序规则名，继续 utf8mb4_unicode_ci ✅
          connectionCollation: utf8mb4_unicode_ci
  
  # ---------- Spring Boot SQL 种子数据初始化配置 ----------
  # schema.sql：先执行，设置数据库/表字符集为 utf8mb4（表不存在时ALTER会报错，continue-on-error已忽略）
  # data.sql：后执行，插入 50 条干净的摄影术语 + 器材种子数据
  # mode=always：每次启动都执行（data.sql 内用 INSERT IGNORE / ON DUPLICATE KEY UPDATE 保证幂等）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      # ⚠️ schema.sql 中 ALTER TABLE 在首次启动表不存在时会报错，必须设为 true 忽略，
      #    让流程继续执行 data.sql。真正的语法错误仍会在控制台打印WARN日志。
      continue-on-error: true
      # ⚠️ 乱码终极修复：Windows 默认系统编码是 GBK，Spring Boot 会用 GBK 读 classpath 的 .sql 脚本
      #    data.sql/schema.sql 都是 UTF-8 文件，如果不显式指定 encoding=UTF-8，
      #    里面的中文会被按 GBK 解码后再按 UTF-8 写入 MySQL → 写入的就是乱码！
      #    加上这行后 Spring Boot 统一按 UTF-8 读取，中文就对了。
      encoding: UTF-8
  
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    redis:
      host: localhost
      port: 6379
      # ⚠️ Windows下如果没启动Redis，Spring Boot启动会默认无限等连接，卡死在初始化
      #    必须设短超时（500ms），连不上快速失败，同时不要让启动挂死
      connect-timeout: 500ms
      timeout: 500ms
      lettuce:
        pool:
          max-active: 2
          max-idle: 1
          min-idle: 0
          max-wait: 500ms
        shutdown-timeout: 100ms

  # ---------- RabbitMQ：AI 异步任务消息中间件（设计见 docs/RabbitMQ异步化设计方案.md） ----------
  # 拓扑（exchange/队列/DLX）由 config/RabbitConfig.java 声明，这里只管连接与消费参数
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # ⚠️ 凭据走环境变量，默认 guest 仅本机可登录；生产必须覆盖，不要在这里写死真实密码
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # ⚠️ 短超时：broker 没起来时快速失败，由 AiTaskProducer 捕获后走"就地同步执行"降级，
    #    不能让请求线程无限等待（对齐 Redis 那边 connect-timeout: 500ms 的思路）
    connection-timeout: 5s
    # 发布方确认：消息真正落到 broker 才算成功，回调里记日志（见 RabbitConfig）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # ⚠️ 一次只预取 1 条：AI 调用动辄几十秒，预取多了会让消息堆在单个消费者内存里空等，
        #    也可能一次性向 DashScope 打出超过配额的并发请求
        prefetch: 1
        concurrency: 2
        max-concurrency: 4
        # 消费失败不原地 requeue，交给 RetryInterceptor 退避重试 / RepublishMessageRecoverer 进死信
        # （原地 requeue 会造成失败消息热循环，把 CPU 和日志打满）
        default-requeue-rejected: false
        # ⚠️ broker 没起时队列不存在，若保持默认 true 会让容器启动失败 → 应用起不来。
        #    设 false 后只记 WARN，配合 RabbitAdmin.ignoreDeclarationExceptions 做到
        #    "broker 挂了应用照样启动，提交时再降级同步执行"
        missing-queues-fatal: false
        acknowledge-mode: auto

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

openai:
  api-key: ${OPENAI_API_KEY:your-openai-api-key}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}

qwen:
  api-key: ${QWEN_API_KEY:}
  model: qwen-turbo
  vl-model: qwen3-vl-plus
  timeout: 180000

chroma:
  host: 127.0.0.1
  # ⚠️ 必须和 chroma-service/main.py 中 uvicorn.run(port=xxx) 保持一致！
  #   · chroma-service/main.py 默认 port=8002
  #   · 旧配置 8000 是错的，之前会导致后端连不上向量库，RAG全部挂
  port: 8002
  collection-name: photography_dictionary

# ---------- RAG 自动同步配置 ----------
app:
  rag:
    # ⚠️ 应急开关：true = 启动时直接删 chroma 集合重建（乱码/向量坏了用一次）
    #    正常运行时保持 false，否则每次启动都重跑 50 条向量化，浪费时间
    force-reset-on-start: false

  # ---------- Redis 缓存配置（设计说明见 docs/Redis缓存设计方案.md） ----------
  cache:
    # 全局开关：false = 所有缓存读写直接短路（直查数据库），便于做"开/关缓存"的对比压测
    enabled: true
    # 统一 key 命名空间，与聊天记忆的 sheyingtong: 保持一致
    key-prefix: "sheyingtong:cache:"
    # TTL 随机抖动比例（±10%），防同一时刻大批 key 集体过期造成雪崩
    jitter-ratio: 0.1
    # 空值占位缓存 TTL，防穿透
    null-ttl: 30s
    # Tier A 静态知识库：词典 50 条 / 器材 36 条，均无写入口，用长 TTL 整表缓存
    dict-ttl: 12h
    gear-ttl: 12h

  # ---------- AI 任务异步化配置（设计说明见 docs/RabbitMQ异步化设计方案.md） ----------
  ai:
    async:
      # 总开关：false = 不投消息、请求线程同步执行到底（即改造前的行为）
      # 用于"开/关异步"的对比压测，也是出问题时的应急回退开关
      enabled: true
      # broker 不可达（AmqpConnectException 等）时是否就地同步执行
      #   true  = 慢但可用（请求会挂到 AI 返回为止，但功能正常）
      #   false = 直接返回 503，让前端明确知道"现在提交不了"
      fallback-to-sync: true
      # 单条消息最多被消费几次（条件更新闸门用 attempt_count 卡这个上限）
      max-attempts: 3
      # 最后一次尝试仍失败时：true=写兜底 mock 结果并把任务标记 DEGRADED（页面永远不空）；false=直接标 FAILED
      degrade-on-failure: true
      # 消费失败后的指数退避：5s → 10s → 20s…（上限 retry-max-backoff）
      retry-backoff: 5s
      retry-backoff-multiplier: 2.0
      retry-max-backoff: 60s

# ---------- Springdoc OpenAPI / Swagger UI 配置 ----------
springdoc:
  # 启用 /v3/api-docs 端点
  api-docs:
    enabled: true
    path: /v3/api-docs
  # 启用 Swagger UI 页面
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 在 Swagger UI 中显示 "Authorize" 按钮，支持 JWT 输入
    tags-sorter: alpha
    operations-sorter: alpha
    # 页面加载时默认展开的层级：1 = 仅展开标签(Tag)
    doc-expansion: list
  # 扫描所有 Controller 包路径（多模块时防止漏扫）
  packages-to-scan: com.sheyingtong.controller
  # 匹配所有 /api/** 接口（可选，默认扫描所有已映射请求）
  paths-to-match: /**
  # 支持同时加载 spring-boot-starter-web + webflux（项目里同时引入了两个 starter）
  prefer-mvc: true
