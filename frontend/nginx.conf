# sheyingtong 前端 nginx 配置（Docker 容器内使用）
# 职责：托管 Vite 构建产物 + 反代后端（/api REST + SSE + /uploads 图片）
server {
    listen 80;
    server_name _;

    # 与后端 multipart 上限对齐（application.yml: max-file-size 50MB）
    client_max_body_size 50m;

    # ---- 前端静态资源（Vue History 路由模式） ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 刷新/直达深层路由时兜底到 index.html，交给 vue-router 处理
        try_files $uri $uri/ /index.html;
    }

    # ---- REST API + SSE 流式（AI 聊天逐字输出） ----
    # SSE 必须关 buffering，否则聊天流会被 nginx 攒批，前端感知到"卡死直到结束"
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---- 上传图片静态资源（avatar/历史缩略图，WebConfig 映射 /uploads/**） ----
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}